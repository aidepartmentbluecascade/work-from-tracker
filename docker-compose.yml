# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: wfh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wfh
    ports:
      - "5432:5432"
    volumes:
      - wfh_pgdata:/var/lib/postgresql/data

volumes:
  wfh_pgdata:
